# =====================================================================
#  Скилл статей - конфиг проекта Luxx Aparts
#  Собран по репозиторию сайта luxx-aparts.kz 17.09.2026.
#  Меняете что-то в бизнесе (цены, правила, оффер) - правьте здесь,
#  методология и скрипты читают этот файл.
# =====================================================================

project:
  domain: "luxx-aparts.kz"
  content_path: "/blog"

audience:
  profile: >
    Человек, который едет в Алматы на несколько дней или на месяц и выбирает,
    где жить недорого: путешественник, студент, вахтовик, командировочный,
    приехавший на лечение или на учёбу. Города он не знает: не понимает, далеко
    ли Сайран от центра, как добраться из аэропорта ночью, чем хостел
    отличается от квартиры посуточно и что входит в цену койко-места.
    Боится грязи, шума, соседей, скрытых доплат и того, что его не заселят
    после полуночи. Ищет конкретное действие и конкретную цену, а не термины.
    Часть аудитории - женщины, которые едут одни и выбирают по безопасности.
  jargon_level: "low"

voice:
  # Образцы голоса = уже опубликованные статьи сайта. Они же корпус
  # для originality-check.py.
  source: "./content/blog"
  forbidden:
    - "в современном мире"
    - "не секрет, что"
    - "в наши дни"
    - "идеальный вариант"
    - "оптимальное решение"
    - "незабываемые впечатления"
    - "уютная атмосфера"
    - "погрузиться в атмосферу"
    - "широкий спектр"
    - "на любой вкус и кошелёк"

cta:
  offer: "Прямое бронирование койко-места или номера в Luxx Aparts - без комиссии агрегатора, оплата при заселении"
  url: "https://luxx-aparts.kz/bronirovanie"

editorial:
  # Стоп-словарь: превосходные степени без доказательства и обещания
  # результата - главный юридический риск в рекламе размещения.
  banned_words:
    - "лучший хостел"
    - "самый дешёвый"
    - "дешевле всех"
    - "гарантируем"
    - "гарантированно"
    - "100%"
    - "элитный"
    - "premium-класс"

cms:
  # custom = адаптер под этот сайт (см. tools/publish.py):
  #   draft     -> content/blog-drafts/<slug>.md  (на сайт не попадает)
  #   published -> content/blog/<slug>.md         (коммит + пуш = публикация)
  adapter: "custom"

tools:
  originality:
    max_cosine: 0.60
    ngram_n: 5
    max_ngram: 0.30
  cadence:
    # Откалибровано по вашим четырём статьям: их средняя плотность 2.52/1k,
    # максимум 2.88. Порог 4.5 - выше вашего живого письма, чтобы скрипт не
    # ловил ложные срабатывания на нормальном русском.
    max_per_1k: 4.5
    # Длинное тире: в ваших статьях его до 13 на текст, это нормальная русская
    # типографика. 0 означал бы «запрещено», поэтому порог с запасом.
    max_dashes: 18
  read_aloud:
    max_sentence_words: 40
  structure:
    # Минимум две внутренние ссылки: сайт маленький, перелинковка решает.
    min_internal_links: 2

image:
  # Обложки не генерим: у сайта своя библиотека фотографий в public/photos,
  # статья подключает её номером в поле cover (например, cover: 03).
  tool: ""
  format: "webp"
  dest: "./public/photos"
  ratio: "16:9"
  max_kb: 200

# ---------------------------------------------------------------------
#  Специфика площадки - читать перед Этапом 6 (написание текста)
# ---------------------------------------------------------------------
site_notes:
  frontmatter_fields: "title, description, date, updated, author, cover, tags"
  # Заголовки H2 обязательно формулировать вопросом: сборка сама собирает
  # из них FAQPage-разметку (src/lib/blog.ts, extractFaq).
  h2_style: "каждый H2 - вопрос, ответ идёт первым абзацем под ним"
  facts_source: "public/llms.txt и public/llms-full.txt - актуальные цены, правила, адрес"
  after_publish: "node scripts/indexnow.mjs - пинг Яндекса и Bing"
